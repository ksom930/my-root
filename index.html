<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>通勤ルートチェッカー</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #container { display: flex; flex-direction: column; height: 100%; }
        #info-panel { padding: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; display: flex; justify-content: space-around; }
        .route-info { text-align: center; width: 45%; padding: 5px; border-radius: 5px; }
        #routeA-info { border-left: 5px solid #0000FF; } /* ルートAは青 */
        #routeB-info { border-left: 5px solid #FF0000; } /* ルートBは赤 */
        .time { font-size: 1.4rem; font-weight: bold; color: #333; }
        .distance { font-size: 0.9rem; color: #666; }
        #map { flex-grow: 1; height: 100%; }
    </style>
</head>
<body>

    <div id="container">
        <!-- 所要時間を表示するパネル -->
        <div id="info-panel">
            <div id="routeA-info" class="route-info">
                <div>ルートA (国道)</div>
                <div id="timeA" class="time">計算中...</div>
                <div id="distanceA" class="distance">- km</div>
            </div>
            <div id="routeB-info" class="route-info">
                <div>ルートB (バイパス)</div>
                <div id="timeB" class="time">計算中...</div>
                <div id="distanceB" class="distance">- km</div>
            </div>
        </div>
        <!-- 地図を表示するエリア -->
        <div id="map"></div>
    </div>

    <script>
        // 【設定】自宅、職場、それぞれの経由地の住所、または緯度経度を入力
        const CONFIG = {
            origin: "35.951436085177804, 139.99986558211424",      // 自宅（出発地）
            destination: "35.94511123727137, 139.9216219134685",    // 職場（目的地）
            waypointA: "35.90220767896441, 139.99870256819088",          // ルートAの経由地
            waypointB: "35.9818521699697, 139.88946285973827"               // ルートBの経由地
        };

        function initMap() {
            // 地図の初期化
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 12,
                center: { lat: 35.6895, lng: 139.6917 }, // 初期位置（東京）
                mapTypeControl: false,
                streetViewControl: false
            });

	    // ★ここを追加：交通状況レイヤーを作成して地図に紐付ける
    	    const trafficLayer = new google.maps.TrafficLayer();
    	    trafficLayer.setMap(map);

            const directionsService = new google.maps.DirectionsService();

            // ルートA（青）の設定と描画
            const directionsRendererA = new google.maps.DirectionsRenderer({
                map: map,
                polylineOptions: { strokeColor: '#0000FF', strokeOpacity: 0.4, strokeWeight: 6 },
                suppressMarkers: false
            });

            // ルートB（赤）の設定と描画
            const directionsRendererB = new google.maps.DirectionsRenderer({
                map: map,
                polylineOptions: { strokeColor: '#FF0000', strokeOpacity: 0.4, strokeWeight: 6 },
                suppressMarkers: false
            });

            // 経路の計算を実行
            calculateRoute(directionsService, directionsRendererA, CONFIG.waypointA, 'timeA', 'distanceA');
            calculateRoute(directionsService, directionsRendererB, CONFIG.waypointB, 'timeB', 'distanceB');
        }

        function calculateRoute(service, renderer, waypoint, timeId, distanceId) {
            service.route({
                origin: CONFIG.origin,
                destination: CONFIG.destination,
                waypoints: [{ location: waypoint, stopover: false }], // 立ち寄らずに通過する設定
                optimizeWaypoints: false,
                travelMode: google.maps.TravelMode.DRIVING,
                drivingOptions: {
                    departureTime: new Date(), // 現在時刻の渋滞情報を考慮
                    trafficModel: 'bestguess'
                }
            }, (result, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    renderer.setDirections(result);
                    
                    // 結果から所要時間と距離を抽出して画面に表示
                    const route = result.routes[0].legs[0];
                    // drivingOptionsを設定している場合、duration_in_traffic（渋滞考慮の時間）が取得できます
                    const durationText = route.duration_in_traffic ? route.duration_in_traffic.text : route.duration.text;
                    
                    document.getElementById(timeId).innerText = durationText;
                    document.getElementById(distanceId).innerText = route.distance.text;
                } else {
                    document.getElementById(timeId).innerText = "エラー";
                }
            });
        }
    </script>
    <!-- 【重要】YOUR_API_KEY 部分を取得したAPIキーに書き換えます -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsl6HVuu9oW2NMsMRpbmAytzOOhzQxkm0&callback=initMap" async defer></script>
</body>
</html>
