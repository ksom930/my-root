<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>通勤ルートチェッカー</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #container { display: flex; flex-direction: column; height: 100%; }
        
        /* ボタンと情報をまとめるパネル */
        #top-panel { background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; padding: 10px; }
        #switch-area { text-align: center; margin-bottom: 10px; }
        .btn { padding: 6px 20px; font-size: 1rem; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; cursor: pointer; }
        .btn.active { background: #007bff; color: #fff; border-color: #007bff; font-weight: bold; }
        
        #info-panel { display: flex; justify-content: space-around; }
        .route-info { text-align: center; width: 45%; padding: 5px; border-radius: 5px; }
        #routeA-info { border-left: 5px solid #0000FF; }
        #routeB-info { border-left: 5px solid #FF0000; }
        .time { font-size: 1.4rem; font-weight: bold; color: #333; }
        .distance { font-size: 0.9rem; color: #666; }
        #map { flex-grow: 1; height: 100%; }
    </style>
</head>
<body>

    <div id="container">
        <div id="top-panel">
            <div id="switch-area">
                <button id="btn-outbound" class="btn active" onclick="switchDirection('outbound')">行き（出勤）</button>
                <button id="btn-inbound" class="btn" onclick="switchDirection('inbound')">帰り（退勤）</button>
            </div>
            <div id="info-panel">
                <div id="routeA-info" class="route-info">
                    <div>ルートA (利根大橋)</div>
                    <div id="timeA" class="time">計算中...</div>
                    <div id="distanceA" class="distance">- km</div>
                </div>
                <div id="routeB-info" class="route-info">
                    <div>ルートB (目吹橋)</div>
                    <div id="timeB" class="time">計算中...</div>
                    <div id="distanceB" class="distance">- km</div>
                </div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        // 【設定】住所、および「行き」「帰り」それぞれの経由地を設定
        const CONFIG = {
            home: "35.951436085177804, 139.99986558211424", 
            office: "35.94511123727137, 139.9216219134685",
            
            // 行き（出勤）用の経由地
            outboundWaypointA: "35.90220767896441, 139.99870256819088",
            outboundWaypointB: "35.9818521699697, 139.88946285973827",
            
            // 帰り（退勤）用の経由地（行きと同じで問題なければ同じ住所でOK）
            inboundWaypointA: "35.90220767896441, 139.99870256819088",
            inboundWaypointB: "35.9818521699697, 139.88946285973827"
        };

        let map, directionsService, directionsRendererA, directionsRendererB;
        let currentDirection = 'outbound'; // 初期状態は「行き」

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 12,
                center: { lat: 35.6895, lng: 139.6917 },
                mapTypeControl: false,
                streetViewControl: false
            });

            // 渋滞レイヤーの表示
            const trafficLayer = new google.maps.TrafficLayer();
            trafficLayer.setMap(map);

            directionsService = new google.maps.DirectionsService();

            directionsRendererA = new google.maps.DirectionsRenderer({
                map: map,
                polylineOptions: { strokeColor: '#0000FF', strokeOpacity: 0.5, strokeWeight: 6 }
            });

            directionsRendererB = new google.maps.DirectionsRenderer({
                map: map,
                polylineOptions: { strokeColor: '#FF0000', strokeOpacity: 0.5, strokeWeight: 6 }
            });

            // 初回計算
            updateRoutes();
        }

        // 行き・帰りのデータを切り替えて再計算する関数
        function updateRoutes() {
            let start, end, wpA, wpB;

            if (currentDirection === 'outbound') {
                start = CONFIG.home;
                end = CONFIG.office;
                wpA = CONFIG.outboundWaypointA;
                wpB = CONFIG.outboundWaypointB;
            } else {
                start = CONFIG.office;
                end = CONFIG.home;
                wpA = CONFIG.inboundWaypointA;
                wpB = CONFIG.inboundWaypointB;
            }

            document.getElementById('timeA').innerText = "計算中...";
            document.getElementById('timeB').innerText = "計算中...";

            calculateRoute(directionsRendererA, start, end, wpA, 'timeA', 'distanceA');
            calculateRoute(directionsRendererB, start, end, wpB, 'timeB', 'distanceB');
        }

        function calculateRoute(renderer, start, end, waypoint, timeId, distanceId) {
            directionsService.route({
                origin: start,
                destination: end,
                waypoints: [{ location: waypoint, stopover: false }],
                optimizeWaypoints: false,
                travelMode: google.maps.TravelMode.DRIVING,
                drivingOptions: {
                    departureTime: new Date(),
                    trafficModel: 'bestguess'
                }
            }, (result, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    renderer.setDirections(result);
                    const route = result.routes[0].legs[0];
                    const durationText = route.duration_in_traffic ? route.duration_in_traffic.text : route.duration.text;
                    document.getElementById(timeId).innerText = durationText;
                    document.getElementById(distanceId).innerText = route.distance.text;
                } else {
                    document.getElementById(timeId).innerText = "エラー";
                }
            });
        }

        // ボタンが押された時の処理
        function switchDirection(direction) {
            if (currentDirection === direction) return;
            currentDirection = direction;

            // ボタンの見た目を切り替え
            document.getElementById('btn-outbound').classList.toggle('active', direction === 'outbound');
            document.getElementById('btn-inbound').classList.toggle('active', direction === 'inbound');

            // ルートを再計算
            updateRoutes();
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>
